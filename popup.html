<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Sports</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 2px solid #111111;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    label.row.light {
      border-color: #767676;
      font-weight: 400;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #111111;
      flex: none;
    }
    .site {
      font-weight: 600;
      word-break: break-all;
    }
    .field-label {
      display: block;
      font-weight: 600;
      margin: 14px 0 4px;
    }
    .hint {
      color: #444444;
      font-size: 12px;
      margin: 0 0 6px;
    }
    #siteList {
      color: #111111;
      font-size: 13px;
      margin: 0;
      word-break: break-word;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 8px;
      border: 2px solid #767676;
      border-radius: 8px;
      font: inherit;
      color: #111111;
      background: #ffffff;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #111111;
    }
    #saved {
      height: 16px;
      font-size: 12px;
      color: #0a6b2d;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>No Sports</h1>

  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Block sports</span>
  </label>

  <label class="row light" id="siteRow">
    <input type="checkbox" id="onSite">
    <span>Run on <span class="site" id="siteName">this site</span></span>
  </label>

  <span class="field-label">Sites it runs on</span>
  <p id="siteList"></p>

  <label class="field-label" for="extra">Extra words to block</label>
  <p class="hint">One per line. Good for teams or names that still get through.</p>
  <textarea id="extra" spellcheck="false" placeholder="pickleball&#10;some team name"></textarea>
  <div id="saved"></div>

  <script src="popup.js"></script>
</body>
</html>
